name = "blog-assistant-worker"
main = "src/index.ts"
compatibility_date = "2026-09-12"

# No custom domain — this Worker is called by the chat widget's client-side
# JS (fetch from the browser), not addressed directly, so the default
# *.workers.dev subdomain is enough for now. CORS will need scoping once the
# real calling origin (blog.koorevaar.com) is wired up.

# Persists console.log/console.error output so the dashboard's Logs tab shows
# past requests, matching ui-worker's [observability] setup.
[observability]
enabled = true

# Workers AI — used for both query embedding (bge-m3, matching the model
# already used to embed KnowledgeBase content locally via Ollama, see the
# Phase 0 compatibility test in the backlog item) and answer generation.
[ai]
binding = "AI"

# Semantic cache: {questionEmbedding, chunks, cachedAt} entries, brute-force
# cosine-compared against an incoming question's embedding before falling
# through to a live Cosmos VectorDistance() query.
#
# PLACEHOLDER ID — run `wrangler kv namespace create ASSISTANT_CACHE`
# (requires `wrangler login`, not available in this sandbox — same
# limitation as the original ARTICLES_FALLBACK namespace in api-proxy) and
# paste the real id here before deploying.
[[kv_namespaces]]
binding = "ASSISTANT_CACHE"
id = "REPLACE_ME_ASSISTANT_CACHE_KV_ID"

# Cosmos account + KnowledgeBase-Reader identity (see infra/cosmos-db.bicep's
# knowledgeBaseReaderPrincipalId): a dedicated, read+executeQuery-only
# identity for this Worker's retrieval path, deliberately narrower than
# KnowledgeBase-Writer since this Worker is public-facing. Tenant/client ID
# aren't secrets (same reasoning as the .NET API's AzureAd TenantId/ClientId
# in appsettings.json) — only the client secret is, set via
# `wrangler secret put KNOWLEDGEBASE_READER_CLIENT_SECRET`.
#
# PLACEHOLDERS — the KnowledgeBase-Reader app registration doesn't exist yet
# (create it by hand in the personal Entra tenant, same as
# KnowledgeBase-Writer: no App ID URI/role/admin consent needed, Cosmos
# checks its own RBAC by object ID) — fill in the real tenant/client ID here
# once it does.
[vars]
COSMOS_ACCOUNT_NAME = "cosmos-koorevaar"
KNOWLEDGEBASE_READER_TENANT_ID = "REPLACE_ME_TENANT_ID"
KNOWLEDGEBASE_READER_CLIENT_ID = "REPLACE_ME_CLIENT_ID"

# A shared secret (`wrangler secret put ...`) for the cache-invalidation
# endpoint ACA will call still lands in a later commit, mirroring
# ApiSecurity's existing pattern.
