name = "blog-assistant-worker"
main = "src/index.ts"
compatibility_date = "2026-09-12"

# Custom domain (ai-assistant.koorevaar.com) configured directly in the
# Cloudflare dashboard, not via a `routes` entry here -- this Worker is
# called by the chat widget's client-side JS (fetch from the browser), so it
# needs a stable address. See ALLOWED_ORIGIN below for CORS scoping.

# Persists console.log/console.error output so the dashboard's Logs tab shows
# past requests, matching ui-worker's [observability] setup.
[observability]
enabled = true

# Workers AI — used for both query embedding (bge-m3, matching the model
# already used to embed KnowledgeBase content locally via Ollama, see the
# Phase 0 compatibility test in the backlog item) and answer generation.
[ai]
binding = "AI"

# Semantic cache: {questionEmbedding, chunks, cachedAt} entries, brute-force
# cosine-compared against an incoming question's embedding before falling
# through to a live Cosmos VectorDistance() query.
[[kv_namespaces]]
binding = "ASSISTANT_CACHE"
id = "aa6b0fb3feb043b9a4187d11789a0300"

# Cosmos account — same account the blog API uses, not sensitive.
[vars]
COSMOS_ACCOUNT_NAME = "cosmos-koorevaar"
# The one browser origin allowed to call POST /ask cross-origin. The chat
# widget lives on www.koorevaar.com, a separate site/project from this
# repo's own blog.koorevaar.com -- not a secret, CORS is about telling
# browsers which caller to trust, not about hiding this value.
ALLOWED_ORIGIN = "https://www.koorevaar.com"

# KnowledgeBase-Reader identity (see infra/cosmos-db.bicep's
# knowledgeBaseReaderPrincipalId): a dedicated, read+executeQuery-only
# identity for this Worker's retrieval path, deliberately narrower than
# KnowledgeBase-Writer since this Worker is public-facing.
#
# KNOWLEDGEBASE_READER_TENANT_ID / _CLIENT_ID / _CLIENT_SECRET are all set via
# the dashboard's Settings -> Variables and Secrets (or `wrangler secret put
# <NAME>`), by deliberate choice, not committed here even though the tenant/
# client ID aren't strictly secret. Set all three as "Secret" (encrypted)
# there, not the plain-text variant — a plain-text dashboard var that isn't
# also declared in this file's own [vars] gets wiped by the next
# `wrangler deploy` (which syncs plain vars to exactly match [vars]); a
# Secret-type value persists independently of what's deployed, same as
# ARTICLES_API_KEY in api-proxy.
#
# CACHE_INVALIDATION_SECRET (Phase 5): checked on POST
# /internal/invalidate-cache, called by ACA (not the chat widget) right
# after a successful article create/update. Same off-wrangler.toml Secret
# treatment as everything else in this section, for the same reason.

# EMBEDDINGS_COUNT_SECRET: checked on GET /internal/embeddings-count,
# called by a Worker behind the site's homepage counter, never the chat
# widget or a browser directly. Same off-wrangler.toml Secret treatment as
# everything else in this section.

# SEARCH_SECRET: checked on GET /search, called by ui-worker's own SSR route
# handler for the blog search box (server-to-server, never a browser
# directly). Same off-wrangler.toml Secret treatment as everything else in
# this section -- deliberately set to the identical value/name as ui-worker's
# own SEARCH_SECRET, mirroring how ARTICLES_API_KEY is the same value/name on
# both api-proxy and blog-service-api.

# TURNSTILE_SECRET_KEY (Phase 6): verified on every POST /ask. Set via the
# dashboard's Variables and Secrets or `wrangler secret put
# TURNSTILE_SECRET_KEY`, never here -- same off-wrangler.toml treatment as
# the three KNOWLEDGEBASE_READER_* values above, for the same reason (a
# Secret-type value survives the next `wrangler deploy`, a plain-text
# dashboard var doesn't). See env.ts's own comment on this field for which
# Turnstile widget this needs to be paired with -- the chat widget lives on
# www.koorevaar.com, not blog.koorevaar.com as originally assumed. This
# Worker only ever needs the secret key; the paired site key belongs
# wherever the widget actually renders.
