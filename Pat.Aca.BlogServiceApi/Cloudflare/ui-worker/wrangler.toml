name = "blog-ui-worker"
main = "src/index.tsx"
compatibility_date = "2026-08-26"

# Custom domain — unlike api-proxy (which stays on *.workers.dev, since
# nothing calls it from a browser address bar), this Worker IS user-facing,
# so it's attached to a subdomain of the linked koorevaar.com zone. Requires
# koorevaar.com to already be added as a zone in this Cloudflare account.
routes = [
  { pattern = "blog.koorevaar.com", custom_domain = true }
]

# Base URL of the api-proxy Worker — it already attaches the shared API key
# and renders article Markdown to HTML server-side, so this Worker never
# needs an API key of its own. Plain `[vars]` entry, not a secret, same idea
# as API_BASE_URL in api-proxy's wrangler.toml.
#
# Deployed as "blog-api-proxy" — note this doesn't match the `name` in
# api-proxy/wrangler.toml ("blog-service-worker"), so it was likely renamed
# by hand at some point after that file was last committed.
[vars]
API_PROXY_BASE_URL = "https://blog-api-proxy.pkoorevaar.workers.dev"
# This Worker's own public URL — used to build absolute canonical/og:url
# links and the sitemap (see SITE_URL in types.ts for why this can't just be
# derived from the request).
SITE_URL = "https://blog.koorevaar.com"

# Persists console.log/console.error output so the dashboard's Logs tab shows
# past requests, not just a live stream started after the fact — without
# this, `wrangler tail` (or the dashboard's "Begin log stream") only ever
# shows what happens after you start watching.
[observability]
enabled = true
