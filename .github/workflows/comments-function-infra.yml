name: Comments Function Infra

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Manual only — this provisions/updates real Azure resources (storage
# account, Flex Consumption plan, Function App, App Insights, RBAC), so
# it's deliberately not wired to any push trigger, same reasoning as the
# Cosmos DB workflow.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Comments Function hosting (Bicep)
        shell: bash
        env:
          COSMOS_ENDPOINT_URI: ${{ secrets.COSMOS_ENDPOINT_URI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          ACS_SENDER_ADDRESS: ${{ vars.ACS_SENDER_ADDRESS }}
          MODERATION_NOTIFICATION_EMAIL: ${{ vars.MODERATION_NOTIFICATION_EMAIL }}
        run: |
          set -euo pipefail

          # Reuses the same COSMOS_ENDPOINT_URI secret already configured
          # for the Deploy workflow — same Cosmos account, no reason for a
          # second copy of the same value.
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/comments-function.bicep \
            --parameters \
              cosmosEndpointUri="$COSMOS_ENDPOINT_URI" \
              cloudflareAccountId="$CLOUDFLARE_ACCOUNT_ID" \
              cloudflareApiToken="$CLOUDFLARE_API_TOKEN" \
              acsConnectionString="$ACS_CONNECTION_STRING" \
              acsSenderAddress="$ACS_SENDER_ADDRESS" \
              acsRecipientEmail="$MODERATION_NOTIFICATION_EMAIL"

          # Moderation__ModerationModelId/DailyModerationQuota/
          # AutoPublishMinScore/ModerationSystemPrompt are deliberately not
          # passed here — comments-function.bicep's own defaults apply on
          # first deploy, and per the design, tuning them afterward is
          # meant to happen directly against the Function App's settings
          # (Portal or `az functionapp config appsettings set`), not by
          # re-running this workflow.

      - name: Show Function App name, principal ID, and required manual RBAC
        shell: bash
        run: |
          set -euo pipefail

          PRINCIPAL_ID=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name comments-function \
            --query "properties.outputs.functionAppPrincipalId.value" \
            -o tsv)
          STORAGE_ID=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name comments-function \
            --query "properties.outputs.storageAccountId.value" \
            -o tsv)
          APP_INSIGHTS_ID=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name comments-function \
            --query "properties.outputs.applicationInsightsId.value" \
            -o tsv)

          echo -n "Function App name: "
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name comments-function \
            --query "properties.outputs.functionAppName.value" \
            -o tsv

          echo "Managed identity principal ID (for the Cosmos DB workflow's blogCommentsFunctionPrincipalId input): $PRINCIPAL_ID"

          # This workflow's own service principal deliberately does NOT have
          # Microsoft.Authorization/roleAssignments/write (see
          # comments-function.bicep's own comment on why that permission is
          # kept out of automation here) -- these four assignments are
          # applied by hand, once, using the commands below. A one-time
          # step: the Function App's principal id is stable across future
          # code deploys and infra re-runs, as long as the Function App
          # itself is never deleted and recreated.
          echo "::notice::Run these commands yourself (this workflow's identity deliberately can't run them) to finish granting the Function's managed identity what it needs:"
          echo ""
          echo "az role assignment create --assignee-object-id $PRINCIPAL_ID --assignee-principal-type ServicePrincipal --role \"Storage Blob Data Owner\" --scope $STORAGE_ID"
          echo "az role assignment create --assignee-object-id $PRINCIPAL_ID --assignee-principal-type ServicePrincipal --role \"Storage Queue Data Contributor\" --scope $STORAGE_ID"
          echo "az role assignment create --assignee-object-id $PRINCIPAL_ID --assignee-principal-type ServicePrincipal --role \"Storage Table Data Contributor\" --scope $STORAGE_ID"
          echo "az role assignment create --assignee-object-id $PRINCIPAL_ID --assignee-principal-type ServicePrincipal --role \"Monitoring Metrics Publisher\" --scope $APP_INSIGHTS_ID"
          echo ""
          echo "::notice::Function App just created/updated — its managed identity has no Cosmos DB access yet either."
          echo "::notice::Run the 'Cosmos DB' workflow with the principal ID printed above to grant that (that one Cosmos's own sqlRoleAssignments mechanism, not Microsoft.Authorization/roleAssignments, so this workflow's identity can do it)."
