name: Deploy Comments Function

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: func-blog-comments-moderation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Pat.Aca.BlogCommentsModerationFunction/Pat.Aca.BlogCommentsModerationFunction.csproj \
            --configuration Release \
            --output ./comments-function-publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Flex Consumption uses a different deployment technology ("One
      # Deploy") than classic Function App plans ("Zip Deploy") --
      # confirmed via research that Azure/functions-action auto-detects
      # the plan type and picks the right one, and explicitly supports
      # OIDC/RBAC-credential auth (via the azure/login step above), no
      # publish-profile secret needed -- consistent with this repo's
      # OIDC-everywhere convention. Raw `az functionapp deployment
      # source config-zip` was considered instead (matching deploy-app.yml's
      # preference for plain az CLI over marketplace actions for the
      # actual deploy step) but that specific command is documented as
      # the classic-plan path, with real reported reliability issues
      # against Flex Consumption -- this action's own plan-aware handling
      # is the safer choice here.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./comments-function-publish
          resource-group: ${{ env.RESOURCE_GROUP }}
