name: Cosmos DB

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Manual only — this provisions/updates a real Azure Cosmos DB account and its
# RBAC role assignment, so it's deliberately not wired to any push trigger.

on:
  workflow_dispatch:
    inputs:
      blogServicePrincipalId:
        description: >
          Principal ID of the blog service Container App's system-assigned
          managed identity. Get it from the 'Deploy' workflow's output, or via
          `az containerapp show --name blog-service-api --resource-group <rg>
          --query identity.principalId -o tsv`.
        required: true
      location:
        description: >
          Azure region for the Cosmos DB account, e.g. northeurope,
          swedencentral. Leave blank to use the resource group's own region.
          Override this if that region is out of Cosmos capacity (a
          'ServiceUnavailable' error) — the account name doesn't depend on
          location, so it's safe to retry here with a different value.
        required: false
      blogAuthorPrincipalId:
        description: >
          Your own AAD object ID, to grant yourself Data Explorer read/write
          access (Cosmos DB Built-in Data Contributor) — get it via
          `az ad signed-in-user show --query id -o tsv`. Leave blank to skip;
          re-run later with this filled in without affecting anything else.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Cosmos DB (Bicep)
        shell: bash
        env:
          LOCATION: ${{ inputs.location }}
          AUTHOR_PRINCIPAL_ID: ${{ inputs.blogAuthorPrincipalId }}
        run: |
          set -euo pipefail

          params=(blogServicePrincipalId="${{ inputs.blogServicePrincipalId }}")
          if [ -n "$LOCATION" ]; then
            echo "Overriding Cosmos DB account location: $LOCATION"
            params+=(location="$LOCATION")
          fi
          if [ -n "$AUTHOR_PRINCIPAL_ID" ]; then
            echo "Granting Data Contributor to author principal: $AUTHOR_PRINCIPAL_ID"
            params+=(blogAuthorPrincipalId="$AUTHOR_PRINCIPAL_ID")
          fi

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/cosmos-db.bicep \
            --parameters "${params[@]}"

      - name: Show Cosmos DB endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo -n "Cosmos endpoint (set as the COSMOS_ENDPOINT_URI repo variable for the Deploy workflow): "
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name cosmos-db \
            --query "properties.outputs.cosmosEndpoint.value" \
            -o tsv
