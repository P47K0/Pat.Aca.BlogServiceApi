name: Cosmos DB

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Manual only — this provisions/updates a real Azure Cosmos DB account and its
# RBAC role assignment, so it's deliberately not wired to any push trigger.

on:
  workflow_dispatch:
    inputs:
      blogServicePrincipalId:
        description: >
          Principal ID of the blog service Container App's system-assigned
          managed identity. Get it from the 'Deploy' workflow's output, or via
          `az containerapp show --name blog-service-api --resource-group <rg>
          --query identity.principalId -o tsv`.
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Cosmos DB (Bicep)
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/cosmos-db.bicep \
            --parameters blogServicePrincipalId="${{ inputs.blogServicePrincipalId }}"

      - name: Show Cosmos DB endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo -n "Cosmos endpoint (set as the COSMOS_ENDPOINT_URI repo variable for the Deploy workflow): "
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name cosmos-db \
            --query "properties.outputs.cosmosEndpoint.value" \
            -o tsv
