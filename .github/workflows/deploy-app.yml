name: Deploy

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_TAG: gha-${{ github.run_id }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      ACA_ENV_NAME: ${{ vars.ACA_ENVIRONMENT_NAME }}
      APP_NAME: blog-service-api
      ARTICLES_API_KEY: ${{ secrets.ARTICLES_API_KEY }}
      COSMOS_ENDPOINT_URI: ${{ secrets.COSMOS_ENDPOINT_URI }}
      # Phase 5 of the AI assistant project: lets this API tell
      # assistant-worker to invalidate its semantic cache after an article
      # write. ASSISTANT_INVALIDATE_CACHE_KEY must match that Worker's own
      # CACHE_INVALIDATION_SECRET (set via `wrangler secret put`) -- see
      # Pat.Aca.BlogServiceApi/Cloudflare/assistant-worker/README.md.
      ASSISTANT_INVALIDATE_CACHE_URL: ${{ secrets.ASSISTANT_INVALIDATE_CACHE_URL }}
      ASSISTANT_INVALIDATE_CACHE_KEY: ${{ secrets.ASSISTANT_INVALIDATE_CACHE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Pat.Aca.BlogServiceApi/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/blog-service-api:gha-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy blog service API
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$DOCKERHUB_USERNAME/blog-service-api:$IMAGE_TAG"

          echo "Deploying image: $IMAGE"

          # Try to update first (most common case)
          if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "Container App exists → Updating..."
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --revision-suffix "blog-${{ github.run_number }}" \
              --set-env-vars \
                "ApiKey=$ARTICLES_API_KEY" \
                "CosmosDb__EndpointUri=$COSMOS_ENDPOINT_URI" \
                "CosmosDb__Database=ArticlesDB" \
                "CosmosDb__Container=Articles" \
                "AssistantWorker__InvalidateCacheUrl=$ASSISTANT_INVALIDATE_CACHE_URL" \
                "AssistantWorker__InvalidateCacheKey=$ASSISTANT_INVALIDATE_CACHE_KEY" \
                "ASPNETCORE_ENVIRONMENT=Production"
          else
            echo "Container App does not exist → Creating..."
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV_NAME" \
              --image "$IMAGE" \
              --ingress external \
              --target-port 8080 \
              --system-assigned \
              --revision-suffix "blog-${{ github.run_number }}" \
              --env-vars \
                "ApiKey=$ARTICLES_API_KEY" \
                "CosmosDb__EndpointUri=$COSMOS_ENDPOINT_URI" \
                "CosmosDb__Database=ArticlesDB" \
                "CosmosDb__Container=Articles" \
                "AssistantWorker__InvalidateCacheUrl=$ASSISTANT_INVALIDATE_CACHE_URL" \
                "AssistantWorker__InvalidateCacheKey=$ASSISTANT_INVALIDATE_CACHE_KEY" \
                "ASPNETCORE_ENVIRONMENT=Production" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 0 \
              --max-replicas 1

            echo "::notice::Container App just created — its managed identity has no Cosmos DB access yet."
            echo "::notice::Run the 'Cosmos DB' workflow with the principal ID printed below to grant it."
          fi

      - name: Show API URL and managed identity principal ID
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment completed"

          echo -n "API URL: https://"
          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv

          echo -n "Managed identity principal ID (for the Cosmos DB workflow's blogServicePrincipalId input): "
          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "identity.principalId" \
            -o tsv
